<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Revelation</title>

<style>
body{
background:black;
color:#c8b37f;
font-family:Georgia;
text-align:center;
padding-top:100px;
}

#clue{
display:none;
font-size:28px;
}

#countdown{
font-size:32px;
}
</style>
</head>

<body>

<h1>Test Revelation</h1>

<div id="countdown"></div>

<div id="clue">
THE TEST WORKED 😈
</div>

<script>

const revealDate = new Date(Date.now() + 10 * 60 * 1000);

function updatePage(){

const now = new Date();

if(now >= revealDate){
document.getElementById("countdown").style.display="none";
document.getElementById("clue").style.display="block";
return;
}

const diff = revealDate - now;

const minutes = Math.floor((diff/(1000*60))%60);
const seconds = Math.floor((diff/1000)%60);

document.getElementById("countdown").innerHTML =
"The Revelation remains sealed.<br><br>" +
minutes + "m " +
seconds + "s";
}

updatePage();
setInterval(updatePage,1000);

</script>

</body>
</html>
